name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Syntax und Dateien prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript in index.html prüfen
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > app.js
          test -s app.js || { echo "Kein Skriptblock in index.html gefunden"; exit 1; }
          node --check app.js
          rm app.js

      - name: Service Worker prüfen
        run: node --check sw.js

      - name: Manifest prüfen
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Referenzierte Dateien prüfen
        run: |
          fehlt=0
          for f in manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png; do
            if [ ! -f "$f" ]; then echo "fehlt: $f"; fehlt=1; fi
          done
          exit $fehlt
