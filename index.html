<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151F">
<meta name="description" content="CarCollection: Garage, Logbuch, Dokumente und Teile für deine Fahrzeuge - alle Daten bleiben auf deinem Gerät.">
<title>CarCollection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CarCollection">
<style>
:root{
  --bg:#10151F; --surface:#171E2B; --surface2:#1F2837; --line:#2C3649;
  --text:#E9EDF5; --muted:#8C97AE; --accent:#6EC6E0; --accent-ink:#08222B;
  --foil1:#EBDCA9; --foil2:#8C7838; --ok:#6CCB9C; --warn:#E8C25E; --danger:#E5766D;
  --font:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(var(--bg) 78%,transparent)}
.top h1{margin:0;font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:.02em}
.top small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ico{padding:8px 10px;line-height:0}
.btn.ico svg{display:block;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl{display:flex;align-items:center;gap:10px}
.actions{flex-wrap:wrap}
.actions .wide{flex:1 1 100%}
button.card{display:block;width:100%;border:0;text-align:left;color:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini .photo{aspect-ratio:4/3}
.mini .mh{padding:0 12px;margin-top:-22px;position:relative;z-index:3}
.mini .mh b{display:block;font-family:var(--font);font-size:18px;line-height:1.1}
.mini .mh span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini .ms{padding:8px 12px 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini .ms.sub{padding:4px 12px 12px;flex-wrap:wrap;row-gap:3px}
.mini .ms>span{white-space:nowrap}
.mini .ms .pill{margin:0;font-size:10.5px;padding:2px 6px}
.add{border:1.5px dashed var(--line);border-radius:22px;background:transparent;color:var(--muted);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px}
.add b{font-family:var(--font);font-size:34px;color:var(--accent);line-height:1}
.alert{margin-bottom:16px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;background:var(--surface);overflow:hidden}
.alert button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:14px}
.alert button:first-child{border-top:0}
.alert .danger{color:var(--danger)} .alert .warn{color:var(--warn)}
.wrap{padding:4px 16px 24px;max-width:560px;margin:0 auto}

/* Karte */
.card{padding:2px;border-radius:22px;background:linear-gradient(135deg,var(--foil1),var(--foil2) 28%,#F3E7BC 52%,#7A6731 78%,#E4D198);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card-in{border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#1A2231,#131A26)}
.photo{position:relative;aspect-ratio:16/10;background:var(--surface2) center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(19,26,38,.95))}
.photo .ph{position:relative;z-index:1;color:var(--muted);text-align:center;font-size:13px}
.plate{position:absolute;z-index:2;left:12px;top:12px;background:#F2F4F8;color:#111;font-family:var(--font);font-weight:700;letter-spacing:.08em;padding:3px 10px 3px 20px;border-radius:6px;font-size:14px;border:1.5px solid #111;background-image:linear-gradient(#1D4FA3,#1D4FA3);background-size:10px 100%;background-repeat:no-repeat}
/* Gleiches Schild, aber im Textfluss statt über dem Bild */
.plate.flat{position:static;font-size:11px;padding:2px 7px 2px 15px;background-size:7px 100%;letter-spacing:.06em;border-width:1px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.photo .edit{position:absolute;z-index:2;right:10px;top:10px;background:rgba(16,21,31,.72);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--text)}
.head{padding:0 18px;margin-top:-34px;position:relative;z-index:3}
.head h2{margin:0;font-family:var(--font);font-size:30px;line-height:1.05;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{margin:16px 18px 0}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.stat span{color:var(--muted);font-size:13px}
.stat b{font-family:var(--font);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
/* Die FIN ist 17 Zeichen lang und würde sonst an die Beschriftung stoßen */
.stat b.long{font-size:15px;letter-spacing:.02em}
.pill{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;background:var(--surface2)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.danger{color:var(--danger)}
.foot{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:6px;background:rgba(255,255,255,.02)}
.foot div{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.foot div:last-child{border-right:0}
.foot b{display:block;font-family:var(--font);font-size:18px}
.foot span{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

/* Listen */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 13px;border-radius:99px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 12px;color:var(--muted);font-size:13px}
.sum b{font-family:var(--font);font-size:20px;color:var(--text)}
.grp{margin:8px 2px 6px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600}
.item{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;align-items:center}
.item .ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--surface2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--font);font-size:12px;font-weight:700}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:12.5px}
.item .r{text-align:right;font-family:var(--font);font-size:15px;white-space:nowrap}
.item .r small{display:block;font-family:var(--body);color:var(--muted);font-size:11.5px}
.empty{text-align:center;color:var(--muted);padding:44px 20px;border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(23,30,43,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* Vollbildanzeige für Dokumente */
body.noscroll{overflow:hidden}
#full{position:fixed;inset:0;z-index:30;background:#070A10;display:flex;flex-direction:column}
#full[hidden]{display:none}
.fbar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(16,21,31,.9);border-bottom:1px solid var(--line)}
.fbar .ft{flex:1;min-width:0}
.fbar .ft b{display:block;font-family:var(--font);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
/* width/height statt max-*: ein kleiner Scan soll die Fläche auch ausfüllen,
   sonst bleibt er so winzig wie vorher im Sheet. */
.fimg img{width:100%;height:100%;object-fit:contain;touch-action:pinch-zoom}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,8,14,.66)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.panel h2{margin:0 0 12px;font-family:var(--font);font-size:22px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:64px;resize:vertical}
input.upper{text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:0}
.viewer img{width:100%;border-radius:12px;background:var(--bg)}
.viewer .meta{color:var(--muted);font-size:13px;margin:10px 0}
.filebox{display:flex;gap:10px;margin-top:6px}
.filebox .btn{flex:1}
.fname{font-size:13px;color:var(--ok);margin-top:8px}
.rmeta{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.panel .stats{margin:14px 0 0}
.note{margin:14px 2px 0;color:var(--muted);font-size:12px;text-align:center}
.note.warn{color:var(--warn)}

/* Zuschneiden und Entzerren eines Scans */
#edit{position:fixed;inset:0;z-index:40;background:#070A10;display:flex;flex-direction:column}
#edit[hidden]{display:none}
.ebar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(16,21,31,.9);border-bottom:1px solid var(--line)}
.ebar .et{flex:1;min-width:0;text-align:center}
.ebar .et b{display:block;font-family:var(--font);font-size:17px}
.ebar .et span{display:block;color:var(--muted);font-size:12px}
.estage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;touch-action:none;overflow:hidden}
/* Der Rahmen sitzt exakt auf dem angezeigten Bild - die Griffe rechnen in
   Prozent davon, dann stimmen sie bei jeder Anzeigegröße. */
.ewrap{position:relative;line-height:0;touch-action:none;max-width:100%;max-height:100%}
.ewrap canvas,.ewrap video{display:block;max-width:100%;max-height:100%;border-radius:4px;background:#000}
.ewrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ewrap svg polygon{fill:rgba(110,198,224,.14);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
/* 44 px Grifffläche - kleiner trifft man auf einem Handy nicht zuverlässig. */
.ecorner{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:transparent;border:0;padding:0;touch-action:none}
.ecorner::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--accent);border:2px solid #0B1018}
.ecorner:active::after{inset:9px}
.etools{flex:none;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(23,30,43,.96)}
.etools .btn{flex:1}
.etools .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ebusy{color:var(--muted);font-size:13px;text-align:center;padding:20px}

/* Dokumente am Logbuch-Eintrag */
.dlist{margin-top:6px}
.dlist .d{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-top:6px}
.dlist .d .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:10px;font-weight:700;color:var(--accent)}
.dlist .d .n{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlist .d .n small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlist .d button{flex:none;background:none;border:0;color:var(--muted);padding:5px 6px;line-height:0}
.dlist .d button svg{display:block;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dhint{color:var(--muted);font-size:12px;margin:8px 2px 0}

/* Einstellungen */
.sect{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px 16px;margin-bottom:14px}
.sect h2{margin:0;font-family:var(--font);font-size:19px}
.sect .stats{margin:8px 0 0}
.sect .stat b{font-size:16px}
.sect .actions{margin-top:12px}
.sect .note{text-align:left;margin:12px 0 0;line-height:1.5}
.sect .note b{color:var(--text)}
</style>
</head>
<body>
<div class="top">
  <div class="tl"><div><h1 id="title">CarCollection</h1><small id="sub"></small></div></div>
  <div id="topBtn"></div>
</div>
<div class="wrap" id="view"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="full" hidden></div>
<div id="edit" hidden></div>
<input type="file" id="coverIn" accept="image/*" hidden>
<input type="file" id="backupIn" accept=".txt,.json,text/plain,application/json" hidden>

<script>
const PARTCATS=['Motor','Getriebe','Fahrwerk','Bremsen','Reifen','Felgen','Elektrik','Karosserie','Innenraum','Ersatzteile','Sonstiges'];
const DOCCATS=['Fahrzeugpapiere','TÜV / HU','Versicherung','Rechnungen',...PARTCATS];
const LOGTYPES=['Reparatur','Wartung','Umbau','Sonstiges'];
const STATUS=['Verbaut','Auf Lager','Bestellt'];

const newVeh=()=>({id:uid(),v:{name:'',variant:'',plate:'',year:'',power:'',displacement:'',fuel:'',km:0,tuev:'',vin:'',hsn:'',tsn:''},logs:[],parts:[],docs:[],cover:false});
/* Die ausgelieferte Fassung. Muss mit CACHE in sw.js und mit version.json
   übereinstimmen - die CI prüft das, siehe .github/workflows/checks.yml. */
const APP_VERSION='10';
let S=null, VEH={}, IDX=[], view='garage';
let tab='card', logFilter='Alle', partFilter='Alle';
let updateReady='', updateNote='', backupNote='';
const IMG={}; let persistent=true; const mem={};

/* ---------- Speicher ----------
   Reihenfolge: Host-API (Artifact-Umgebung) > IndexedDB > localStorage > Arbeitsspeicher.
   Im Browser tragen die Daten in IndexedDB; localStorage ist nur der Notnagel,
   weil Fotos als Data-URL dessen ~5-MB-Grenze schnell sprengen. */
const DB='fahrzeugakte', KV='kv';
let dbp=null;
const idb=()=>dbp||(dbp=new Promise((res,rej)=>{
  const rq=indexedDB.open(DB,1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore(KV);
  rq.onsuccess=()=>res(rq.result);
  rq.onerror=rq.onblocked=()=>rej(rq.error||new Error('IndexedDB nicht verfügbar'));
}));
const tx=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(KV,mode), rq=fn(t.objectStore(KV));
  t.oncomplete=()=>res(rq?rq.result:undefined);
  t.onabort=t.onerror=()=>rej(t.error||new Error('Speichern fehlgeschlagen'));
}));

const BACKENDS={
  host:{
    probe:()=>window.storage&&window.storage.get?window.storage.get('akte:probe'):Promise.reject(new Error('keine Host-API')),
    get:k=>window.storage.get(k).then(r=>r?r.value:null),
    set:(k,v)=>window.storage.set(k,v),
    del:k=>window.storage.delete(k)
  },
  idb:{
    probe:()=>window.indexedDB?tx('readwrite',s=>s.delete('akte:probe')):Promise.reject(new Error('kein IndexedDB')),
    get:k=>tx('readonly',s=>s.get(k)).then(v=>v??null),
    set:(k,v)=>tx('readwrite',s=>s.put(v,k)),
    del:k=>tx('readwrite',s=>s.delete(k))
  },
  ls:{
    probe:async()=>{localStorage.setItem('akte:probe','1');localStorage.removeItem('akte:probe')},
    get:async k=>localStorage.getItem(k),
    set:async(k,v)=>localStorage.setItem(k,v),
    del:async k=>localStorage.removeItem(k)
  },
  mem:{
    probe:async()=>{},
    get:async k=>mem[k]??null,
    set:async(k,v)=>{mem[k]=v},
    del:async k=>{delete mem[k]}
  }
};
let B=BACKENDS.mem;
async function initStore(){
  for(const n of ['host','idb','ls','mem']){
    try{ await BACKENDS[n].probe(); B=BACKENDS[n]; break; }catch(e){}
  }
  persistent=B!==BACKENDS.mem;
  // Dauerhafte Ablage anfragen, damit der Browser die Akte nicht bei Platzmangel räumt
  if(persistent&&navigator.storage&&navigator.storage.persist){ try{await navigator.storage.persist()}catch(e){} }
}
const store={
  async get(k){ try{return await B.get(k)}catch(e){return null} },
  async set(k,v){ try{await B.set(k,v);return true}catch(e){return false} },
  async del(k){ try{await B.del(k)}catch(e){} }
};
const saveIndex=()=>store.set('akte:index',JSON.stringify({ids:IDX}));
const save=async()=>{await store.set('akte:v:'+S.id,JSON.stringify(S));await saveIndex();};
const coverKey=id=>'img:cover:'+id;
async function loadImg(key){
  if(IMG[key]) return IMG[key];
  const d=await store.get(key); if(d) IMG[key]=d; return d;
}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const eur=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const km=n=>Number(n||0).toLocaleString('de-DE')+' km';
const dt=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d?`${d}.${m}.${y}`:`${m}/${y}`};
const opts=(arr,sel)=>arr.map(o=>`<option${o===sel?' selected':''}>${esc(o)}</option>`).join('');

/* Safari kennt <input type="month"> nicht; dann zwei Auswahlfelder statt eines Monatsfelds. */
const nativeMonth=(()=>{const i=document.createElement('input');i.setAttribute('type','month');return i.type==='month'})();
const MONTHNAMES=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function monthField(label,name,val){
  if(nativeMonth) return field(label,name,val,'month');
  const [y,m]=String(val||'').split('-');
  const now=new Date().getFullYear(), years=[];
  for(let i=now-2;i<=now+15;i++) years.push(String(i));
  return `<label>${label}</label><div class="two">
    <select name="${name}_m"><option value="">Monat</option>${MONTHNAMES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}"${v===m?' selected':''}>${n}</option>`}).join('')}</select>
    <select name="${name}_y"><option value="">Jahr</option>${years.map(v=>`<option${v===y?' selected':''}>${v}</option>`).join('')}</select>
  </div>`;
}
// Führt die beiden Auswahlfelder wieder zu "JJJJ-MM" zusammen.
function normMonth(o,name){
  if((name+'_y') in o){
    o[name]=(o[name+'_y']&&o[name+'_m'])?o[name+'_y']+'-'+o[name+'_m']:'';
    delete o[name+'_y']; delete o[name+'_m'];
  }
  return o;
}

/* Eine Datei an den Nutzer geben. Das Teilen-Blatt hat überall dort Vorrang,
   wo der Browser es für Dateien anbietet: Auf dem Handy führt es direkt nach
   Drive oder in eine Nachricht, statt die Datei im Download-Ordner abzulegen,
   wo man sie von Hand wieder heraussuchen müsste. Im Startbildschirm-Modus
   auf dem iPhone scheitert <a download> ohnehin teils stillschweigend.
   Der Download bleibt die Rückfallebene - auf dem Rechner ist er der Normalfall,
   weil es dort kein Teilen-Blatt für Dateien gibt. */
async function saveFile(name,blob){
  let file=null;
  try{ file=new File([blob],name,{type:blob.type}) }catch(e){}
  if(file&&navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return 'geteilt' }
    // Abgebrochen heißt abgebrochen - dann nicht hinterher doch herunterladen.
    catch(e){ if(e&&e.name==='AbortError') return 'abgebrochen' }
  }
  const a=document.createElement('a');
  const url=URL.createObjectURL(blob);
  a.href=url; a.download=name; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3e4);
  return 'geladen';
}

/* Ob der Browser das Teilen-Blatt für eine Datei dieser Art anbietet. Chrome
   hat dafür eine feste Erlaubnisliste, auf der weder .json noch .ics stehen -
   geprüft wird deshalb mit einer Probe genau des Typs, der später herausgeht,
   nicht mit irgendeiner Datei. */
function kannTeilen(name,typ){
  try{
    return !!(navigator.canShare&&navigator.share
      &&navigator.canShare({files:[new File([''],name,{type:typ})]}));
  }catch(e){ return false }
}

// data:-URL zurück in einen Blob; iOS öffnet data:-Verweise nicht.
function dataToBlob(dataUrl){
  const [head,b64]=String(dataUrl).split(',');
  const mime=(head.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

/* ---------- Zuschneiden und Entzerren ----------
   Ein abfotografiertes Blatt ist schief und hat den Schreibtisch mit drauf.
   Die vier Ecken sagt der Nutzer an, die Rechnung macht die App selbst - keine
   Zusatzbibliothek, damit es auch ohne Netz geht. */

/* Die Datei als Canvas laden, ohne sie unterwegs neu zu kodieren. fileToData
   macht daraus sofort ein JPEG; entzerrt man das anschließend und speichert es
   wieder als JPEG, komprimiert man zweimal. Hier wird einmal kodiert, am Ende. */
function fileToCanvas(file,max){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Das Bild konnte nicht geladen werden.')); };
    img.src=url;
  });
}

/* Lineares Gleichungssystem lösen, Gauß mit Spaltenpivotisierung.
   m ist eine n x (n+1)-Matrix; zurück kommen die n Unbekannten. */
function loese(m){
  const n=m.length;
  for(let i=0;i<n;i++){
    let p=i;
    for(let r=i+1;r<n;r++) if(Math.abs(m[r][i])>Math.abs(m[p][i])) p=r;
    if(Math.abs(m[p][i])<1e-12) return null;      // entartet, z. B. Ecken aufeinander
    [m[i],m[p]]=[m[p],m[i]];
    for(let r=0;r<n;r++){
      if(r===i) continue;
      const f=m[r][i]/m[i][i];
      for(let c=i;c<=n;c++) m[r][c]-=f*m[i][c];
    }
  }
  // Nach der Elimination steht in Zeile i nur noch die Diagonale: x_i = b_i/a_ii
  return m.map((zeile,i)=>zeile[n]/zeile[i]);
}

/* Homographie, die das Zielrechteck (0,0)-(w,h) auf das Viereck im Quellbild
   abbildet. Rückwärts gerechnet: Zu jedem Zielpixel wird der Quellpunkt
   gesucht, dann bleibt im Ergebnis kein Loch.
   ecken: [[x,y] x4] in der Reihenfolge oben-links, oben-rechts,
   unten-rechts, unten-links. */
function homographie(ecken,w,h){
  const ziel=[[0,0],[w,0],[w,h],[0,h]];
  const m=[];
  for(let i=0;i<4;i++){
    const [u,v]=ziel[i], [x,y]=ecken[i];
    m.push([u,v,1,0,0,0,-u*x,-v*x, x]);
    m.push([0,0,0,u,v,1,-u*y,-v*y, y]);
  }
  return loese(m);   // [a,b,c,d,e,f,g,h]
}

const abstand=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);

/* Maße des Ergebnisses aus dem Viereck: die jeweils längere gegenüberliegende
   Kante, damit nichts gestaucht wird. Gedeckelt wie sonst auch auf max px. */
function zielMasse(ecken,max){
  let w=Math.max(abstand(ecken[0],ecken[1]),abstand(ecken[3],ecken[2]));
  let h=Math.max(abstand(ecken[0],ecken[3]),abstand(ecken[1],ecken[2]));
  const s=Math.min(1,max/Math.max(w,h));
  return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))};
}

/* Das Viereck aus dem Quellcanvas geradegerückt in ein neues Canvas.
   Bilinear abgetastet - mit dem nächsten Nachbarn wird Schrift fransig. */
function entzerren(src,ecken,max=1600){
  const {w,h}=zielMasse(ecken,max);
  const k=homographie(ecken,w,h);
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  if(!k){ out.getContext('2d').drawImage(src,0,0,w,h); return out; }
  const [a,b,c,d,e,f,g,hh]=k;
  const sctx=src.getContext('2d');
  const s=sctx.getImageData(0,0,src.width,src.height), sd=s.data, sw=src.width, sh=src.height;
  const octx=out.getContext('2d');
  const o=octx.createImageData(w,h), od=o.data;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const nen=g*x+hh*y+1;
      const u=(a*x+b*y+c)/nen, v=(d*x+e*y+f)/nen;
      const i=(y*w+x)*4;
      if(u<0||v<0||u>sw-1||v>sh-1){ od[i]=od[i+1]=od[i+2]=255; od[i+3]=255; continue; }
      const x0=u|0, y0=v|0;
      const x1=x0+1<sw?x0+1:x0, y1=y0+1<sh?y0+1:y0;
      const fx=u-x0, fy=v-y0;
      const p00=(y0*sw+x0)*4, p10=(y0*sw+x1)*4, p01=(y1*sw+x0)*4, p11=(y1*sw+x1)*4;
      for(let ch=0;ch<3;ch++){
        const oben=sd[p00+ch]+(sd[p10+ch]-sd[p00+ch])*fx;
        const unten=sd[p01+ch]+(sd[p11+ch]-sd[p01+ch])*fx;
        od[i+ch]=oben+(unten-oben)*fy;
      }
      od[i+3]=255;
    }
  }
  octx.putImageData(o,0,0);
  return out;
}

/* Dokument-Modus: Graustufen, dann den Kontrast spreizen. Schwarz- und
   Weißpunkt kommen aus dem Histogramm (2. und 98. Perzentil), damit ein paar
   dunkle oder sehr helle Ausreißer nicht die ganze Spreizung auffressen. */
function dokumentModus(src){
  const w=src.width, h=src.height;
  const ctx=src.getContext('2d');
  const bild=ctx.getImageData(0,0,w,h), d=bild.data;
  const hist=new Uint32Array(256);
  const grau=new Uint8ClampedArray(w*h);
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const g=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0;
    grau[p]=g; hist[g]++;
  }
  const gesamt=w*h;
  const perzentil=q=>{
    let summe=0, ziel=gesamt*q;
    for(let i=0;i<256;i++){ summe+=hist[i]; if(summe>=ziel) return i; }
    return 255;
  };
  let lo=perzentil(.02), hi=perzentil(.98);
  if(hi-lo<8){ lo=0; hi=255; }     // fast einfarbig - lieber nichts spreizen
  const skala=255/(hi-lo);
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const octx=out.getContext('2d');
  const o=octx.createImageData(w,h), od=o.data;
  for(let p=0,i=0;p<grau.length;p++,i+=4){
    let g=(grau[p]-lo)*skala;
    g=g<0?0:(g>255?255:g);
    od[i]=od[i+1]=od[i+2]=g; od[i+3]=255;
  }
  octx.putImageData(o,0,0);
  return out;
}

/* Um 90 Grad im Uhrzeigersinn drehen. Die Ecken wandern mit, damit ein schon
   gesetzter Zuschnitt beim Drehen nicht verloren geht. */
function drehen90(src,ecken){
  const w=src.width, h=src.height;
  const out=document.createElement('canvas'); out.width=h; out.height=w;
  const ctx=out.getContext('2d');
  ctx.translate(h,0); ctx.rotate(Math.PI/2); ctx.drawImage(src,0,0);
  // (x,y) -> (H-y, x); die Reihenfolge der Ecken rückt um eins weiter, damit
  // "oben links" auch nach dem Drehen oben links liegt.
  const neu=ecken.map(([x,y])=>[h-y,x]);
  return {canvas:out,ecken:[neu[3],neu[0],neu[1],neu[2]]};
}

function fileToData(file,max){
  return new Promise((res,rej)=>{
    if(file.type==='application/pdf'){
      if(file.size>3.5*1024*1024) return rej(new Error('Die PDF ist zu groß (maximal 3,5 MB).'));
      const r=new FileReader(); r.onload=()=>res({data:r.result,type:'pdf'}); r.onerror=()=>rej(new Error('Datei konnte nicht gelesen werden.')); r.readAsDataURL(file);
    }else{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        res({data:c.toDataURL('image/jpeg',.74),type:'image'});
      };
      img.onerror=()=>rej(new Error('Das Bild konnte nicht geladen werden.'));
      img.src=url;
    }
  });
}

function tuevInfo(v=S.v){
  if(!v.tuev) return null;
  const [y,m]=v.tuev.split('-').map(Number);
  const end=new Date(y,m,0,23,59,59);
  const days=Math.ceil((end-new Date())/864e5);
  if(days<0) return {c:'danger',t:`seit ${-days} Tagen abgelaufen`,days};
  if(days<=60) return {c:'warn',t:`noch ${days} Tage`,days};
  return {c:'ok',t:'gültig',days};
}

/* Die Versionsdatei liegt im Netz, nicht im Cache: Der Service Worker lässt sie
   ausdrücklich durch, sonst meldete die App ewig die Fassung von vorgestern.
   "laut" steuert, ob auch ein Ergebnis ohne Neuigkeit angezeigt wird - beim
   Start läuft die Prüfung still, auf Knopfdruck redet sie. */
async function checkUpdate(laut){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const v=d&&d.version?String(d.version):'';
    if(!v) throw new Error('version.json ohne Versionsangabe');
    if(v!==APP_VERSION){
      updateReady=v;
      updateNote='Fassung '+v+' liegt bereit. Sie wird im Hintergrund geladen – danach die App einmal schließen und neu öffnen.';
      const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
      if(reg) reg.update().catch(()=>{});
    }else{
      updateReady='';
      if(!laut) return;
      updateNote='Du hast die neueste Fassung.';
    }
  }catch(e){
    if(!laut) return;      // still heißt still, auch wenn das Netz fehlt
    updateNote='Prüfung nicht möglich – vermutlich keine Verbindung.';
  }
  render();
}

function viewCard(){

  const total=S.logs.reduce((a,l)=>a+Number(l.cost||0),0)+S.parts.reduce((a,p)=>a+Number(p.price||0),0);
  const dash='–';
  // Leistung, Hubraum und Kraftstoff bleiben in der Bearbeiten-Maske erfassbar,
  // stehen aber nicht mehr auf der Karte.
  const rows=[

/* ---------- Sheet ---------- */
let sheetSave=null, sheetDel=null, pending=null, pendingDoc=null;
/* ---------- Navigation über die History ----------
   Die Wischgeste des Handys soll einen Schritt zurückgehen, nicht die App
   schließen. Dafür bekommt jede Ebene einen eigenen History-Eintrag:
   Garage (Grundeintrag), Fahrzeug, und jedes offene Sheet beziehungsweise
   Vollbild. Der Reiterwechsel bekommt bewusst keinen - das Fahrzeug ist ein
   Bildschirm, die Reiter sind Ansichten darin. */
const screenState=()=>view==='settings'?{s:'settings'}
  :(view==='vehicle'&&S?{s:'vehicle',id:S.id,tab}:{s:'garage'});
/* Modale können übereinanderliegen: Der Zuschnitt eines Scans öffnet sich über
   dem Sheet, aus dem er angestoßen wurde. Deshalb ein Stapel statt eines
   Schalters - sonst schlösse ein einziges Zurück beides auf einmal, samt der
   schon getippten Formularwerte. */
let modalStack=[];      // z. B. ['sheet'] oder ['sheet','edit']

const pushScreen=()=>{history.pushState(screenState(),'');};
const syncScreen=()=>{history.replaceState(screenState(),'');};
function pushModal(art){
  // Dasselbe Modal nicht zweimal in den Stapel legen.
  if(modalStack[modalStack.length-1]===art) return;
  modalStack.push(art);
  history.pushState({s:'modal',k:art},'');
}

/* Ein Modal zu schließen heißt zurückzugehen. Täte man es direkt, bliebe sein
   Eintrag im Stapel stehen und die Geste liefe einmal ins Leere. */
function dismissModal(){
  if(modalStack.length) history.back();   // schließen und zeichnen erledigt popstate
  else { closeEdit(); closeFull(); closeSheet(); render(); }
}
/* Für die Fälle, in denen das Schließen zugleich den Bildschirm wechselt:
   Der Modal-Eintrag wird durch den neuen Bildschirm ersetzt, statt ihn
   zurückzunehmen - sonst landete man auf dem alten Bildschirm. */
function replaceModalWith(){
  closeEdit(); closeFull(); closeSheet();
  modalStack=[];
  syncScreen();
  render();
}

function openSheet(title,body,onSave,del){
  pushModal('sheet');
  sheetSave=onSave; sheetDel=del||null; pending=null;
  $('#sheet').innerHTML=`<div class="scrim" data-a="close"></div><div class="panel" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h2>${esc(title)}</h2><div id="sbody">${body}</div><div class="err" id="err"></div>
  <div class="row">${del?'<button class="btn ghost danger" data-a="del">Löschen</button>':''}<button class="btn ghost" data-a="close">${onSave?'Abbrechen':'Schließen'}</button>${onSave?'<button class="btn primary" data-a="ok">Speichern</button>':''}</div></div>`;
  $('#sheet').classList.add('open');
}
const closeSheet=()=>{$('#sheet').classList.remove('open');$('#sheet').innerHTML='';sheetSave=sheetDel=pending=pendingDoc=logDocs=null;};
const vals=()=>{const o={};document.querySelectorAll('#sbody [name]').forEach(e=>o[e.name]=e.value.trim());return o;};
/* Ohne offene Maske gäbe es sonst einen Fehler im Fehlerpfad - und die Meldung
   käme nie an. Genau daran ließ sich auf dem Gerät nicht erkennen, was
   schiefging: Es kam einfach nichts. */
const showErr=m=>{
  const el=$('#err');
  if(el) el.textContent=m;
  else if(m) alert(m);
};
const field=(label,name,val='',type='text',extra='')=>`<label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra}>`;
const select=(label,name,arr,sel)=>`<label>${label}</label><select name="${name}">${opts(arr,sel)}</select>`;

function bumpKm(k){ k=Number(k); if(k&&k>Number(S.v.km||0)) S.v.km=k; }

/* ---------- Dokumente am Logbuch-Eintrag ----------
   Ein Dokument steht immer nur an einer Stelle: in S.docs. Der Bezug zum
   Logbuch-Eintrag ist das Feld logId. Damit gibt es nichts zu synchronisieren -
   der Reiter Dokumente zeigt dieselben Sätze, nur anders sortiert.

   Solange das Sheet offen ist, sammelt logDocs die noch nicht gespeicherten
   Anhänge. Erst beim Speichern werden sie abgelegt; bricht man ab, bleibt
   nichts zurück. */
let logDocs=null;   // {logId, add:[{tmp,data,type,datei}], off:[docId]}

const docsOf=id=>S.docs.filter(d=>d.logId===id);
// Der Bezug zum Logbuch-Eintrag, sofern es ihn noch gibt. Ein verwaister
// Verweis - etwa nach dem Zusammenführen einer Sicherung - bleibt unerwähnt.
const docBezug=doc=>{
  const l=doc.logId&&S.logs.find(x=>x.id===doc.logId);
  return l?' · zu: '+esc(l.title):'';
};

/* Ein fertiges Dokument in die offene Maske übernehmen - je nachdem, welche
   gerade offen ist. Der Zuschnitt ruft das am Ende auf, PDFs gehen direkt her. */
function docAufnehmen(r,dateiname){
  if(logDocs){
    // Logbuch-Maske: mehrere Anhänge, gespeichert wird erst beim Speichern.
    logDocs.add.push({tmp:uid(),data:r.data,type:r.type,datei:dateiname});
    renderLogDocs(); showErr('');
  }else{
    pending=r;
    const fn=$('#fname'); if(fn) fn.textContent='Ausgewählt: '+dateiname;
    showErr('');
    const ti=document.querySelector('#sbody [name=title]');
    if(ti&&!ti.value) ti.value=dateiname.replace(/\.[^.]+$/,'');
  }
}

function renderLogDocs(){
  const box=$('#logDocs'); if(!box||!logDocs) return;
  const zeile=(kuerzel,name,sub,id)=>`<div class="d"><div class="ic">${kuerzel}</div>
    <div class="n">${esc(name)}<small>${esc(sub)}</small></div>
    <button data-a="logDocOff" data-id="${id}" aria-label="Vom Eintrag lösen"><svg viewBox="0 0 24 24">${ICONS.close}</svg></button></div>`;
  const alte=docsOf(logDocs.logId).filter(d=>!logDocs.off.includes(d.id))
    .map(d=>zeile(d.type==='pdf'?'PDF':'BILD',d.title,d.category+(d.date?' · '+dt(d.date):''),d.id)).join('');
  const neue=logDocs.add
    .map(n=>zeile(n.type==='pdf'?'PDF':'BILD',n.datei,'neu · wird unter dem Titel des Eintrags abgelegt',n.tmp)).join('');
  box.innerHTML=(alte+neue)||'<p class="dhint">Noch nichts angehängt.</p>';
}

/* ---------- Der Zuschnitt-Layer ----------
   Liegt über dem Sheet, aus dem er angestoßen wurde, und hat einen eigenen
   History-Eintrag: Ein Zurück schließt nur ihn, das Sheet bleibt samt
   Eingaben stehen. Zwei Stufen - erst die Ecken, dann das Ergebnis. */
// unberuehrt heißt: Die Ecken liegen noch auf den Kanten des Arbeitsbildes.
// Dann gibt es nichts geradezurücken und das Bild geht unverändert durch.
let E=null;   // {arbeit, ecken, unberuehrt, stufe, ergebnis, ergebnisDok, dokModus, fertig}

/* Eine laufende Kamera im Hintergrund ist ein echter Fehler, kein
   Schönheitsmakel: Sie kostet Strom und die Anzeige am Gerät bleibt an.
   Deshalb an jeder Stelle beendet, an der die Stufe verlassen wird. */
function stromAus(){
  if(E&&E.strom){ E.strom.getTracks().forEach(t=>t.stop()); E.strom=null; }
}

function closeEdit(){
  stromAus();
  const l=$('#edit'); l.hidden=true; l.innerHTML=''; E=null;
  if($('#full').hidden) document.body.classList.remove('noscroll');
}

const eckenVoll=c=>[[0,0],[c.width,0],[c.width,c.height],[0,c.height]];

const leerE=fertig=>({arbeit:null,ecken:null,unberuehrt:true,stufe:'crop',
  ergebnis:null,ergebnisDok:null,dokModus:false,fertig,
  strom:null,video:null,bereit:false,kameraFehler:''});

function openEdit(canvas,fertig){
  stromAus();                       // falls die Kamerastufe noch offen war
  pushModal('edit');
  E=leerE(fertig);
  E.arbeit=canvas; E.ecken=eckenVoll(canvas);
  document.body.classList.add('noscroll');
  $('#edit').hidden=false;
  renderEdit();
}

/* ---------- Die Kamera in der App ----------
   Der Umweg über die Kamera-App von Android (input capture) kam auf dem Pixel
   leer zurück - kein Foto, keine Meldung. Was dort geschieht, liegt außerhalb
   der App. Nimmt sie das Bild selbst auf, gibt es keinen Wechsel mehr, bei dem
   etwas verlorengehen kann. Der alte Weg bleibt als Rückfallebene. */
const kameraGrund=err=>{
  const n=err&&err.name;
  return n==='NotAllowedError'?'Die Kamera ist für diese Seite nicht freigegeben. Erlaube den Zugriff in den Browser-Einstellungen.'
    :n==='NotFoundError'?'Dieses Gerät meldet keine Kamera.'
    :n==='NotReadableError'?'Die Kamera ist gerade von einer anderen App belegt.'
    :n==='SecurityError'?'Die Kamera geht nur über eine gesicherte Verbindung.'
    :'Die Kamera ließ sich nicht öffnen'+(n?' ('+n+')':'')+'.';
};

async function openKamera(fertig){
  stromAus();
  pushModal('edit');
  E=leerE(fertig); E.stufe='kamera';
  document.body.classList.add('noscroll');
  $('#edit').hidden=false;
  renderEdit();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw Object.assign(new Error('keine Kamera'),{name:'NotFoundError'});
    const strom=await navigator.mediaDevices.getUserMedia({video:{
      facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}}});
    // Zwischenzeitlich abgebrochen? Dann die Kamera nicht offen stehen lassen.
    if(!E||E.stufe!=='kamera'){ strom.getTracks().forEach(t=>t.stop()); return; }
    E.strom=strom;
    const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.setAttribute('playsinline','');
    v.srcObject=strom;
    E.video=v;
    /* Erst wenn wirklich Bilddaten fließen, darf ausgelöst werden. Vorher war
       der Auslöser schon freigegeben, während videoWidth noch 0 war - ein Tipp
       darauf lief dann stumm ins Leere. */
    const bereitMachen=()=>{ if(E&&E.video===v&&v.videoWidth){ E.bereit=true; renderEdit(); } };
    v.addEventListener('loadeddata',bereitMachen);
    v.addEventListener('canplay',bereitMachen);
    renderEdit();
    await v.play().catch(()=>{});
    bereitMachen();
  }catch(err){
    if(!E) return;
    E.kameraFehler=kameraGrund(err);
    renderEdit();
  }
}

function renderEdit(){
  if(!E) return;
  const l=$('#edit');
  if(E.stufe==='kamera'){
    const hatVideo=!!(E.video&&!E.kameraFehler);
    const bereit=hatVideo&&E.bereit;
    l.innerHTML=`<div class="ebar">
        <button class="btn ghost ico" data-a="editAb" aria-label="Abbrechen"><svg viewBox="0 0 24 24">${ICONS.close}</svg></button>
        <div class="et"><b>Scannen</b><span>${E.kameraFehler?'Kamera nicht verfügbar'
          :bereit?'Blatt ins Bild rücken und auslösen':'Kamera wird geöffnet …'}</span></div>
        <span style="width:37px"></span>
      </div>
      <div class="estage"><div class="ewrap" id="ewrap">${
        E.kameraFehler?`<p class="ebusy">${esc(E.kameraFehler)}</p>`
        :hatVideo?'':'<p class="ebusy">Kamera wird geöffnet …</p>'}</div></div>
      <div class="etools">${E.kameraFehler
        ?'<button class="btn primary" data-a="kameraApp">Kamera-App verwenden</button>'
        :`<button class="btn primary" data-a="ausloesen"${bereit?'':' disabled'}>Auslösen</button>`}</div>`;
    // Das <video> wird gehalten und wieder angehängt, nicht neu erzeugt -
    // innerHTML risse es sonst samt laufendem Bild heraus.
    if(hatVideo){ $('#ewrap').appendChild(E.video); passeEin(); }
  }else if(E.stufe==='crop'){
    l.innerHTML=`<div class="ebar">
        <button class="btn ghost ico" data-a="editAb" aria-label="Abbrechen"><svg viewBox="0 0 24 24">${ICONS.close}</svg></button>
        <div class="et"><b>Zuschneiden</b><span>Ecken auf die Blattkanten ziehen</span></div>
        <button class="btn ghost ico" data-a="editDrehen" aria-label="Drehen"><svg viewBox="0 0 24 24">${ICONS.rot}</svg></button>
      </div>
      <div class="estage"><div class="ewrap" id="ewrap"></div></div>
      <div class="etools">
        <button class="btn ghost" data-a="editReset">Ganzes Bild</button>
        <button class="btn primary" data-a="editUeber">Übernehmen</button>
      </div>`;
    const wrap=$('#ewrap');
    wrap.appendChild(E.arbeit);
    wrap.insertAdjacentHTML('beforeend',
      `<svg viewBox="0 0 ${E.arbeit.width} ${E.arbeit.height}" preserveAspectRatio="none"><polygon id="equad"/></svg>`+
      [0,1,2,3].map(i=>`<button class="ecorner" data-ecke="${i}" aria-label="Ecke ${i+1}"></button>`).join(''));
    passeEin();
    zeichneEcken();
  }else{
    // Stufe "ergebnis" - E.ergebnis steht hier immer, editUeber setzt es vorher.
    l.innerHTML=`<div class="ebar">
        <button class="btn ghost ico" data-a="editZurueck" aria-label="Zurück zum Zuschneiden"><svg viewBox="0 0 24 24">${ICONS.close}</svg></button>
        <div class="et"><b>Ergebnis</b><span>${E.ergebnis.width} × ${E.ergebnis.height} Punkte</span></div>
        <span style="width:37px"></span>
      </div>
      <div class="estage"><div class="ewrap" id="ewrap"></div></div>
      <div class="etools">
        <button class="btn ghost${E.dokModus?' on':''}" data-a="editDok">Dokument-Modus</button>
        <button class="btn primary" data-a="editSpeichern">Speichern</button>
      </div>`;
    $('#ewrap').appendChild(ergebnisBild());
    passeEin();
  }
}

/* Das anzuzeigende Ergebnis. Der Dokument-Modus geht einmal über alle Pixel;
   beim Hin- und Herschalten wäre das jedes Mal spürbar, deshalb gemerkt. */
function ergebnisBild(){
  if(!E.dokModus) return E.ergebnis;
  if(!E.ergebnisDok) E.ergebnisDok=dokumentModus(E.ergebnis);
  return E.ergebnisDok;
}

/* Das angezeigte Bild genau in die Stufe einpassen.
   Über CSS allein geht das nicht verlässlich: max-height:100% braucht eine
   bestimmte Höhe am Elternteil, und die hat der Rahmen nicht. Bei einem breiten
   Fenster wuchs das Bild dadurch über die Stufe hinaus und verdeckte die Knöpfe
   darunter - der Auslöser war schlicht nicht mehr zu treffen. */
function passeEin(){
  const wrap=$('#ewrap'), medium=wrap&&wrap.firstElementChild;
  const stufe=$('.estage');
  if(!wrap||!medium||!stufe) return;
  const bw=medium.videoWidth||medium.width, bh=medium.videoHeight||medium.height;
  if(!bw||!bh) return;
  const r=stufe.getBoundingClientRect();
  const s=Math.min((r.width-28)/bw,(r.height-28)/bh);   // 14 px Rand je Seite
  medium.style.width=Math.max(1,Math.floor(bw*s))+'px';
  medium.style.height=Math.max(1,Math.floor(bh*s))+'px';
}
// Dreht man das Gerät, ändert sich die Stufe - die Griffe rechnen in Prozent
// und wandern dann von selbst mit.
addEventListener('resize',()=>{ if(E) passeEin(); });

/* Die Griffe rechnen in Prozent des angezeigten Bildes, dann sitzen sie bei
   jeder Anzeigegröße richtig - auch nach dem Drehen. */
function zeichneEcken(){
  if(!E||E.stufe!=='crop') return;
  const w=E.arbeit.width, h=E.arbeit.height;
  const q=$('#equad');
  if(q) q.setAttribute('points',E.ecken.map(p=>p.join(',')).join(' '));
  document.querySelectorAll('#ewrap .ecorner').forEach(el=>{
    const [x,y]=E.ecken[+el.dataset.ecke];
    el.style.left=(x/w*100)+'%'; el.style.top=(y/h*100)+'%';
  });
}

/* Ziehen über Zeiger-Ereignisse: deckt Finger, Stift und Maus gleichermaßen ab.
   setPointerCapture hält den Griff auch, wenn der Finger ihn verlässt. */
document.addEventListener('pointerdown',e=>{
  const griff=e.target.closest&&e.target.closest('.ecorner');
  if(!griff||!E||E.stufe!=='crop') return;
  e.preventDefault();
  const i=+griff.dataset.ecke, bild=$('#ewrap canvas');
  griff.setPointerCapture(e.pointerId);
  const ziehen=ev=>{
    const r=bild.getBoundingClientRect();
    if(!r.width||!r.height) return;
    const x=(ev.clientX-r.left)/r.width*E.arbeit.width;
    const y=(ev.clientY-r.top)/r.height*E.arbeit.height;
    E.ecken[i]=[Math.min(Math.max(x,0),E.arbeit.width),Math.min(Math.max(y,0),E.arbeit.height)];
    E.unberuehrt=false;
    zeichneEcken();
  };
  const ende=()=>{
    griff.removeEventListener('pointermove',ziehen);
    griff.removeEventListener('pointerup',ende);
    griff.removeEventListener('pointercancel',ende);
  };
  griff.addEventListener('pointermove',ziehen);
  griff.addEventListener('pointerup',ende);
  griff.addEventListener('pointercancel',ende);
});

/* ---------- Sicherung ---------- */
const BACKUP_TAG='carcollection';
// Sicherungen aus der Zeit, als die App noch Fahrzeugakte hieß, bleiben lesbar.
const BACKUP_TAGS=[BACKUP_TAG,'fahrzeugakte'];
/* Die Sicherung geht als Textdatei heraus, obwohl ihr Inhalt JSON ist: Chrome
   teilt nur Dateien aus einer festen Erlaubnisliste (.txt, .csv, .pdf, Bilder,
   Ton, Video) - .json steht nicht darauf. Als .json käme sie nie ins
   Teilen-Blatt, sondern immer nur in den Download-Ordner. Beim Einlesen
   entscheidet der Inhalt und nicht die Endung, alte .json-Sicherungen bleiben
   also lesbar. */
const BACKUP_TYP='text/plain';
const backupName=()=>'carcollection-sicherung-'+today()+'.txt';
let pendingBackup=null;

async function collectBackup(){
  const out={app:BACKUP_TAG,version:1,exported:new Date().toISOString(),vehicles:[],images:{}};
  for(const id of IDX){
    const x=VEH[id]; if(!x) continue;
    out.vehicles.push(x);
    if(x.cover){ const d=await loadImg(coverKey(id)); if(d) out.images[coverKey(id)]=d; }
    for(const doc of x.docs||[]){ const d=await loadImg('img:'+doc.id); if(d) out.images['img:'+doc.id]=d; }
  }
  return out;
}

async function applyBackup(d,replace){
  if(replace){
    for(const id of IDX.slice()){
      const x=VEH[id]; if(!x) continue;
      for(const doc of x.docs||[]){ await store.del('img:'+doc.id); delete IMG['img:'+doc.id]; }
      await store.del(coverKey(id)); delete IMG[coverKey(id)];
      await store.del('akte:v:'+id);
    }
    IDX=[]; VEH={};
  }
  let fail=0;
  for(const k of Object.keys(d.images||{})){ if(await store.set(k,d.images[k])) IMG[k]=d.images[k]; else fail++; }
  for(const x of d.vehicles){
    if(!x||!x.id) continue;
    // Beim Zusammenführen ersetzt die Sicherung ein Fahrzeug gleicher Kennung;
    // Bilder verwaister Dokumente werden dabei aufgeräumt.
    const old=VEH[x.id];
    if(old) for(const doc of old.docs||[]) if(!(x.docs||[]).some(y=>y.id===doc.id)){ await store.del('img:'+doc.id); delete IMG['img:'+doc.id]; }
    const base=newVeh();
    const nv={...base,...x,v:{...base.v,...(x.v||{})},logs:x.logs||[],parts:x.parts||[],docs:x.docs||[]};
    VEH[nv.id]=nv;
    if(!IDX.includes(nv.id)) IDX.push(nv.id);
    await store.set('akte:v:'+nv.id,JSON.stringify(nv));
  }
  await saveIndex();
  pendingBackup=null; S=null; view='garage';
  replaceModalWith(); window.scrollTo(0,0);
  if(fail) alert(fail+' Bilder konnten nicht gespeichert werden. Der Speicher ist evtl. voll.');
}

function vehicleSheet(isNew){
  const v=isNew?newVeh().v:S.v;
  openSheet(isNew?'Neues Fahrzeug':'Fahrzeugdaten',
    field('Marke und Modell','name',v.name,'text','placeholder="z. B. VW Golf"')+
    field('Variante','variant',v.variant,'text','placeholder="z. B. GTI Edition 35"')+
    `<div class="two">${field('Kennzeichen','plate',v.plate)}${field('Baujahr','year',v.year,'number','inputmode="numeric"')}</div>`+
    `<div class="two">${field('Leistung (PS)','power',v.power,'number','inputmode="numeric"')}${field('Hubraum (cm³)','displacement',v.displacement,'number','inputmode="numeric"')}</div>`+
    `<div class="two">${field('Kraftstoff','fuel',v.fuel,'text','placeholder="Benzin, Diesel …"')}${field('Kilometerstand','km',v.km||'','number','inputmode="numeric"')}</div>`+
    (nativeMonth
      ?`<div class="two">${field('TÜV gültig bis','tuev',v.tuev,'month')}${field('FIN (optional)','vin',v.vin)}</div>`
      :monthField('TÜV gültig bis','tuev',v.tuev)+field('FIN (optional)','vin',v.vin))+
    // Schlüsselnummern aus der Zulassungsbescheinigung Teil I
    `<div class="two">${field('HSN (zu 2.1)','hsn',v.hsn,'text','inputmode="numeric" maxlength="4" placeholder="4 Ziffern"')}${field('TSN (zu 2.2)','tsn',v.tsn,'text','maxlength="3" class="upper" placeholder="3 Zeichen"')}</div>`,
    async()=>{
      const o=normMonth(vals(),'tuev'); if(!o.name) return showErr('Bitte Marke und Modell eintragen.');
      o.hsn=(o.hsn||'').replace(/\D/g,'').slice(0,4);
      o.tsn=(o.tsn||'').toUpperCase().slice(0,3);
      if(isNew){const nv=newVeh(); nv.v={...nv.v,...o,km:Number(o.km||0)}; VEH[nv.id]=nv; IDX.push(nv.id); S=nv; view='vehicle'; tab='card';}
      else S.v={...S.v,...o,km:Number(o.km||0)};
      await save();
      // Ein neues Fahrzeug wechselt den Bildschirm, das Bearbeiten nicht.
      if(isNew) replaceModalWith(); else dismissModal();
    },
    isNew?null:async()=>{
      const id=S.id;
      for(const d of S.docs){await store.del('img:'+d.id);delete IMG['img:'+d.id];}
      await store.del(coverKey(id));delete IMG[coverKey(id)];await store.del('akte:v:'+id);
      IDX=IDX.filter(x=>x!==id);delete VEH[id];S=null;view='garage';await saveIndex();replaceModalWith();
    });
}

       <input type="file" id="fCam" accept="image/*" capture="environment" hidden>

      async()=>{
        const o=vals(); if(!o.title) return showErr('Bitte einen Titel eintragen.');
        // Erst die Bilder ablegen: Scheitert das, ist am Eintrag noch nichts
        // geändert. Was in diesem Durchgang schon geschrieben wurde, räumen wir
        // wieder weg, damit keine verwaisten Bilder zurückbleiben.
        const geschrieben=[];
        for(const n of logDocs.add){
          const did=uid();
          if(!await store.set('img:'+did,n.data)){
            for(const w of geschrieben){ await store.del('img:'+w); delete IMG['img:'+w]; }
            return showErr('Ein Dokument ließ sich nicht speichern. Die Datei ist evtl. zu groß.');
          }
          IMG['img:'+did]=n.data; n.docId=did; geschrieben.push(did);

        if(isNew) S.logs.push({id:logId,...o}); else Object.assign(l,o);
        // Durchnummeriert wird nur, wenn am Eintrag mehr als ein Dokument hängt.
        const vorhanden=docsOf(logId).filter(x=>!logDocs.off.includes(x.id)).length;
        const mehrere=logDocs.add.length+vorhanden>1;
        logDocs.add.forEach((n,i)=>S.docs.push({

          title:o.title+(mehrere?' ('+(vorhanden+i+1)+')':''),
          category:'Rechnungen', date:o.date||today(), note:''
        }));
        // Gelöste Dokumente verlieren nur den Bezug, nicht ihr Dasein.
        for(const id of logDocs.off){ const doc=S.docs.find(x=>x.id===id); if(doc) delete doc.logId; }

        for(const doc of docsOf(l.id)) delete doc.logId;
        S.logs=S.logs.filter(x=>x.id!==l.id); await save(); dismissModal();

    renderLogDocs();
  },

  // --- Kamera ---
  ausloesen:()=>{
    if(!E||!E.video||!E.video.videoWidth) return;
    const v=E.video;
    const s=Math.min(1,2000/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(v.videoWidth*s));
    c.height=Math.max(1,Math.round(v.videoHeight*s));
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    stromAus(); E.video=null;        // das Bild ist im Kasten, die Kamera darf gehen
    E.arbeit=c; E.ecken=eckenVoll(c); E.unberuehrt=true; E.stufe='crop';
    renderEdit();
  },
  // Rückfallebene: der bisherige Weg über die Kamera-App des Geräts.
  kameraApp:()=>{ stromAus(); if(E) E.video=null; $('#fCam').click(); },

  // --- Zuschnitt ---
  editAb:()=>dismissModal(),                 // Zurück, also nur diese Schicht zu
  editReset:()=>{ if(!E) return; E.ecken=eckenVoll(E.arbeit); E.unberuehrt=true; zeichneEcken(); },
  editDrehen:()=>{
    if(!E) return;
    const r=drehen90(E.arbeit,E.ecken);
    // unberuehrt bleibt, wie es war: Die Drehung steckt bereits im Arbeitsbild.
    // Sie zu einem Grund für die Entzerrung zu machen, hieße das Bild ohne Not
    // neu abzutasten und damit weicher.
    E.arbeit=r.canvas; E.ecken=r.ecken;
    renderEdit();
  },
  editUeber:async(d,el)=>{
    if(!E) return;
    el.disabled=true; el.textContent='Wird gerechnet …';
    // Einen Zug warten, damit der Knopf die Beschriftung auch zeigt, bevor
    // die Rechnung den Faden für ein paar hundert Millisekunden belegt.
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    // Unberührte Ecken ohne Drehung: kein Grund, das Bild neu abzutasten -
    // das machte es nur weicher.
    E.ergebnis=E.unberuehrt?E.arbeit:entzerren(E.arbeit,E.ecken);
    E.ergebnisDok=null;
    E.stufe='ergebnis';
    renderEdit();
  },

    if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Wirklich löschen?';return;}
    if(!fullDoc) return;
    await removeDoc(fullDoc); dismissModal();
  },
  savePdf:async()=>{
    if(!pendingDoc) return;
    try{ await saveFile(pendingDoc.name,dataToBlob(pendingDoc.data)) }
    catch(err){ alert('Die PDF konnte nicht geöffnet werden: '+err.message) }
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const fn=A[el.dataset.a]; if(fn){e.stopPropagation();fn(el.dataset,el);}
});
/* Zurück-Geste und Zurück-Taste: den Zustand aus dem Eintrag herstellen,
   statt die App zu verlassen. */
addEventListener('popstate',e=>{
  const st=e.state||{s:'garage'};
  // Wir landen auf einem Modal, das noch darunterliegt: Dann ist nur die
  // oberste Schicht gemeint. Das Sheet bleibt stehen, mitsamt allem, was
  // schon hineingetippt wurde - deshalb hier auch kein render().
  if(st.s==='modal'){
    modalStack.pop();
    closeEdit();
    return;
  }
  modalStack=[];
  closeEdit(); closeFull(); closeSheet();
  if(st.s==='vehicle'&&VEH[st.id]){ S=VEH[st.id]; view='vehicle'; tab=st.tab||'card'; }
  else if(st.s==='settings'){ S=null; view='settings'; }
  else { S=null; view='garage'; }
  render(); window.scrollTo(0,0);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$('#edit').hidden||!$('#full').hidden||$('#sheet').classList.contains('open')) dismissModal();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='coverIn'&&t.files[0]&&S){
    try{
      const r=await fileToData(t.files[0],1200);
      if(!await store.set(coverKey(S.id),r.data)) throw new Error('Das Bild konnte nicht gespeichert werden. Der Speicher ist evtl. voll.');
      IMG[coverKey(S.id)]=r.data; S.cover=true; await save(); render();
    }catch(err){alert(err.message)}
    t.value='';
  }
  if(t.id==='backupIn'&&t.files[0]){
    const f=t.files[0]; t.value='';
    try{
      const d=JSON.parse(await f.text());
      if(!d||!BACKUP_TAGS.includes(d.app)||!Array.isArray(d.vehicles)) throw new Error('Diese Datei ist keine Sicherung von CarCollection.');
      askRestore(d);
    }catch(err){ alert(err.message||'Die Datei konnte nicht gelesen werden.') }
  }
  if((t.id==='fCam'||t.id==='fPick')&&t.files[0]){
    const datei=t.files[0];
    // Zurücksetzen, sonst meldet sich dieselbe Datei beim zweiten Mal nicht.
    t.value='';
    try{
      if(datei.type==='application/pdf'){ docAufnehmen(await fileToData(datei,1600),datei.name); }
      else{
        // Bilder gehen durch den Zuschnitt - ein abfotografiertes Blatt ist
        // schief, gleich ob es von der Kamera oder aus der Galerie kommt.
        openEdit(await fileToCanvas(datei,2000),r=>docAufnehmen(r,datei.name));
      }
    }catch(err){showErr(err.message)}
  }
});

/* ---------- Start ---------- */
(async()=>{
  await initStore();
  const idx=await store.get('akte:index');
  if(idx){ try{IDX=JSON.parse(idx).ids||[];}catch(e){IDX=[];} }
  else{
    // Übernahme der Daten aus der ersten Version (ein einzelnes Fahrzeug)
    const old=await store.get('akte:main');
    if(old){ try{
      const o=JSON.parse(old), nv={...newVeh(),...o}; nv.id=uid();
      const c=await store.get('img:cover'); if(c) await store.set(coverKey(nv.id),c);
      await store.set('akte:v:'+nv.id,JSON.stringify(nv)); IDX=[nv.id]; await saveIndex();
    }catch(e){} }
  }
  for(const id of IDX){ const r=await store.get('akte:v:'+id); if(r){ try{VEH[id]=JSON.parse(r);}catch(e){} } }
  IDX=IDX.filter(id=>VEH[id]);
  // Nach einem Neuladen steht der zuletzt gezeigte Bildschirm noch im
  // History-Eintrag - den stellen wir wieder her, statt in die Garage zu
  // springen. Sonst verlöre ein Neuladen Fahrzeug und Reiter.
  // Der Grundeintrag ist dabei immer die Garage, der Bildschirm kommt darüber:
  // So führt Zurück nie aus der App heraus, solange man nicht in ihr steht.
  const st=history.state;
  history.replaceState({s:'garage'},'');
  if(st&&st.s==='vehicle'&&VEH[st.id]){ S=VEH[st.id]; view='vehicle'; tab=st.tab||'card'; pushScreen(); }
  else if(st&&st.s==='settings'){ view='settings'; pushScreen(); }
  else if(IDX.length===1){ S=VEH[IDX[0]]; view='vehicle'; pushScreen(); }
  render();
  // Service Worker: macht die Akte offline nutzbar (nur über http/https, nicht bei file://)
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // Still nachsehen, ob eine neuere Fassung ausliegt; meldet sich nur dann.
    checkUpdate(false);
  }
})();
</script>
