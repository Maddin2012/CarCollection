name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Syntax und Dateien prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: JavaScript in index.html prüfen
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > app.js
          test -s app.js || { echo "Kein Skriptblock in index.html gefunden"; exit 1; }
          node --check app.js
          rm app.js

      - name: Service Worker prüfen
        run: node --check sw.js

      - name: Manifest prüfen
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Referenzierte Dateien prüfen
        run: |
          fehlt=0
          for f in manifest.webmanifest sw.js version.json icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png; do
            if [ ! -f "$f" ]; then echo "fehlt: $f"; fehlt=1; fi
          done
          exit $fehlt

      # Die Fassung steht an drei Stellen. Vergisst man eine, meldet die App
      # entweder ewig ein Update oder der Service Worker liefert die alte
      # Fassung weiter aus. Deshalb hier geprüft statt bloß aufgeschrieben.
      - name: Fassungsnummern vergleichen
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const sw = fs.readFileSync("sw.js", "utf8");
            const app = (html.match(/const APP_VERSION=.([^\x27"]+)./) || [])[1];
            const cache = (sw.match(/carcollection-v([0-9]+)/) || [])[1];
            const file = String(JSON.parse(fs.readFileSync("version.json", "utf8")).version || "");
            console.log(`APP_VERSION=${app}  CACHE=v${cache}  version.json=${file}`);
            if (!app || !cache || !file) { console.error("Eine der drei Angaben fehlt."); process.exit(1); }
            if (app !== cache || app !== file) {
              console.error("Die drei Fassungsnummern stimmen nicht überein.");
              process.exit(1);
            }
          '

      # Die Browser-Tests laufen bewusst im selben Job: Das Ruleset verlangt
      # den Check unter genau diesem Namen. Ein eigener Job hieße anders und
      # würde den Merge nicht blockieren, obwohl er im PR rot leuchtet.
      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser-Tests
        run: npm test
